name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (linux-x86_64)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libclang-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler \
            libprotobuf-dev \
            libsqlite3-dev

      - name: Build release (capture errors)
        id: build
        continue-on-error: true
        run: |
          cargo build --release --bin fan-files 2>&1 | tee /tmp/build.log
          echo "EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log

      - name: Check build result
        if: steps.build.outputs.EXIT_CODE != '0'
        run: |
          echo "Build failed. Check the build-log artifact for details."
          exit 1

      - name: Strip binary
        run: strip target/release/fan-files

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/fan-files
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
