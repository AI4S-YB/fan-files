name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (linux-x86_64)
    runs-on: ubuntu-24.04
    container:
      image: rust:latest

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            cmake \
            libclang-dev \
            libssl-dev \
            protobuf-compiler \
            libprotobuf-dev \
            libsqlite3-dev

      - uses: actions/checkout@v4

      - name: Build release binary
        run: cargo build --release --bin fan-files

      - name: Strip binary
        run: strip target/release/fan-files

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/fan-files
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
