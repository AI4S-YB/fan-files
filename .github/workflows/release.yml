name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (linux-x86_64)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libclang-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler \
            libprotobuf-dev \
            libsqlite3-dev

      - name: Verify build environment
        run: |
          rustc --version
          cargo --version
          cc --version
          pkg-config --libs openssl
          protoc --version

      - name: Check compilation (fast)
        run: cargo check --release --bin fan-files

      - name: Build release binary
        run: cargo build --release --bin fan-files

      - name: Strip binary
        run: strip target/release/fan-files

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/fan-files
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
