name: Release

# Triggered by `git push origin v*` tags (e.g. v0.2.7).
# Produces: Linux CLI tar.gz, macOS .dmg/.app, Windows .msi/.exe.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: auto
  RUST_BACKTRACE: 1

jobs:
  build-linux-cli:
    name: Linux CLI (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config protobuf-compiler libsqlite3-dev

      - name: Build CLI binary
        run: cargo build --release --bin fan-files

      - name: Package
        run: |
          cd target/release
          strip fan-files
          tar czf fan-files-linux-x86_64.tar.gz fan-files

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-linux
          path: target/release/fan-files-linux-x86_64.tar.gz

  build-macos-desktop:
    name: macOS Desktop
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install system deps
        run: brew install protobuf cmake

      - name: Build sidecars (macOS arm64)
        run: cargo build --release -p fan-files -p fan-files-share

      - name: npm install
        working-directory: apps/desktop
        run: npm install

      - name: Frontend tests
        working-directory: apps/desktop
        run: npm test -- --run

      # Proven-working path (matches build-desktop.yml green runs): tauri-action
      # builds .app + .dmg on GitHub macOS runners (hdiutil works there).
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.app

  build-windows-desktop:
    name: Windows Desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install system deps
        run: choco install protoc -y

      - name: Build sidecars (Windows x86_64)
        shell: bash
        run: cargo build --release -p fan-files -p fan-files-share

      - name: npm install
        working-directory: apps/desktop
        run: npm install

      - name: Frontend tests
        working-directory: apps/desktop
        run: npm test -- --run

      # Proven-working path (matches build-desktop.yml green runs): tauri-action
      # builds .exe + .msi on GitHub Windows runners (WiX auto-installed).
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  release:
    name: Create GitHub Release v0.2.7
    needs: [build-linux-cli, build-macos-desktop, build-windows-desktop]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List all artifacts
        run: find release-artifacts -type f -print

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE.md
          draft: false
          prerelease: false