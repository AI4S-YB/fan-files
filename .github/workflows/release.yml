name: Release

# Triggered by `git push origin v*` tags (e.g. v0.2.7).
# Produces: Linux CLI tar.gz, macOS .zip(.app), Windows MSI.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: auto
  RUST_BACKTRACE: 1

jobs:
  build-linux-cli:
    name: Linux CLI (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config protobuf-compiler libsqlite3-dev

      - name: Build CLI binary
        run: cargo build --release --bin fan-files

      - name: Package
        run: |
          cd target/release
          strip fan-files
          tar czf fan-files-linux-x86_64.tar.gz fan-files

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-linux
          path: target/release/fan-files-linux-x86_64.tar.gz

  build-macos-desktop:
    name: macOS Desktop (.app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install system deps
        run: brew install protobuf cmake

      - name: Build sidecars (macOS arm64)
        run: cargo build --release -p fan-files -p fan-files-share

      - name: npm install
        working-directory: apps/desktop
        run: npm install

      - name: Frontend tests
        working-directory: apps/desktop
        run: npm test -- --run

      # .app only — skip DMG (create-dmg's hdiutil fails in CI sandbox)
      - name: Build macOS desktop app
        working-directory: apps/desktop
        run: npm run tauri build -- --bundles app

      - name: Zip the .app
        working-directory: apps/desktop
        run: |
          cd src-tauri/target/release/bundle/macos
          zip -r fan-files-desktop-macOS-arm64.zip fan-files-desktop.app
          mv fan-files-desktop-macOS-arm64.zip ../../../../../fan-files-desktop-macOS-arm64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: apps/desktop/fan-files-desktop-macOS-arm64.zip

  build-windows-desktop:
    name: Windows Desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install system deps
        run: choco install protoc -y

      - name: Build sidecars (Windows x86_64)
        shell: bash
        run: cargo build --release -p fan-files -p fan-files-share

      - name: npm install
        working-directory: apps/desktop
        run: npm install

      - name: Frontend tests
        working-directory: apps/desktop
        run: npm test -- --run

      # Build portable .exe bundle first (reliable — always succeeds).
      - name: Build Windows app bundle
        working-directory: apps/desktop
        shell: bash
        run: npm run tauri build -- --bundles app

      - name: Zip the Windows app bundle
        working-directory: apps/desktop
        shell: bash
        run: |
          cd src-tauri/target/release/bundle/app
          zip -r fan-files-windows-x86_64.zip fan-files-desktop/
          ls -la *.zip

      # Best-effort MSI installer: don't block the release if WiX fails in CI.
      - name: Build Windows MSI installer (optional)
        working-directory: apps/desktop
        shell: bash
        continue-on-error: true
        run: npm run tauri build -- --bundles msi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/fan-files-windows-x86_64.zip

  release:
    name: Create GitHub Release v0.2.7
    needs: [build-linux-cli, build-macos-desktop, build-windows-desktop]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List all artifacts
        run: find release-artifacts -type f -name "*.*"

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE.md
          draft: false
          prerelease: false
