[package]
name = "fan-files"
version = "0.2.5"
edition = "2024"

[[bin]]
name = "fan-files"
path = "src/main.rs"

[dependencies]
fan-core = { path = "../fan-core" }
fan-plugin-sdk = { path = "../fan-plugin-sdk" }
mime_guess = "2"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
# P2P 传输（rendezvous 配对 + 打洞直连 + relay 兜底）
magic-wormhole = { version = "0.8", default-features = false, features = ["transfer", "transit", "native-tls"] }
url = "2"
async-io = "2"
futures-lite = "2"
async-fs = "2"
quinn = { version = "0.11", default-features = false, features = ["rustls", "runtime-async-std"] }
rcgen = "0.14.9"
if-addrs = "0.13" # ICE-lite 多候选：枚举本机接口
sha2 = "0.10"
rustls-pki-types = "1.15.1"
# 指纹固定 verifier 需要 rustls 的 dangerous API（ring provider，与 quinn 的 rustls-ring 一致）
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# quinn 的 runtime-async-std 驱动任务跑在 async-std executor 上；调用方用
# async_std::task::block_on 或 async_io::block_on 驱动均可（测试两种都实测可用）
async-std = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
