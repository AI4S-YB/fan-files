[package]
name = "fan-files"
version = "0.2.5"
edition = "2024"

[[bin]]
name = "fan-files"
path = "src/main.rs"

[dependencies]
fan-core = { path = "../fan-core" }
fan-plugin-sdk = { path = "../fan-plugin-sdk" }
mime_guess = "2"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
# P2P 传输（rendezvous 配对 + 打洞直连 + relay 兜底）
magic-wormhole = { version = "0.8", default-features = false, features = ["transfer", "transit", "native-tls"] }
url = "2"
async-io = "2"
futures-lite = "2"
async-fs = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
